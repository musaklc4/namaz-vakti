name: Namaz Vakti Kontrol

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Paketleri yükle
        run: npm install

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Uygulamayı kontrol et
        run: npx expo export --platform ios
